<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال بارگذاری</title>
    <script>
      const path = location.pathname;
      const base = '/ai_bme_intro/';
      const relative = path.startsWith(base) ? path.slice(base.length) : '';
      sessionStorage.setItem('pages-route', JSON.stringify({ relative, query: location.search, hash: location.hash }));
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
